<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Maya Archaeoastronomy favicon — sun-disc with two flanking serpents.
  Hand-authored (vector, single color, no gradients) for clean rendering at
  favicon sizes (16x16 to 64x64). Amber-gold stroke on transparent background,
  matching the project's Tailwind `maya-gold` palette. Inspired by the
  carved-glyph friezes at Chichén Itzá but simplified for legibility.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#d6a83b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Sun disc -->
  <circle cx="32" cy="32" r="9" />
  <!-- Sun rays -->
  <line x1="32" y1="14" x2="32" y2="20" />
  <line x1="32" y1="44" x2="32" y2="50" />
  <line x1="14" y1="32" x2="20" y2="32" />
  <line x1="44" y1="32" x2="50" y2="32" />
  <line x1="19.5" y1="19.5" x2="23.8" y2="23.8" />
  <line x1="40.2" y1="40.2" x2="44.5" y2="44.5" />
  <line x1="19.5" y1="44.5" x2="23.8" y2="40.2" />
  <line x1="40.2" y1="23.8" x2="44.5" y2="19.5" />
  <!-- Left serpent: curving from below-left, head facing outward-left -->
  <path d="M8 50 Q 14 44, 18 50 Q 22 56, 18 58" />
  <path d="M8 50 L 6 52 L 10 52 Z" fill="#d6a83b" />
  <!-- Right serpent: mirrored -->
  <path d="M56 50 Q 50 44, 46 50 Q 42 56, 46 58" />
  <path d="M56 50 L 58 52 L 54 52 Z" fill="#d6a83b" />
  <!-- Step-fret base (Maya geometric motif) -->
  <polyline points="20,56 28,56 28,52 36,52 36,56 44,56" />
</svg>